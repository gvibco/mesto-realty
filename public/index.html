<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#235ee8" />
    <meta
      name="description"
      content="Подберём помещение под ваш бизнес за 48 часов. Офисы, склады и торговые площади от собственников: 1% с покупки, 40% месячной аренды, размещение бесплатно."
    />
    <title>
      Место Бизнес — коммерческая недвижимость: 1% с покупки, 40% аренды
    </title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="/assets/hero.webp"
      imagesrcset="
        /assets/hero-800.webp   800w,
        /assets/hero-1200.webp 1200w,
        /assets/hero-1600.webp 1600w
      "
      imagesizes="(max-width: 800px) 100vw, 50vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/assets/manrope.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">К содержимому</a>
    <header id="header">
      <div class="container header-inner">
        <a class="logo" href="/" aria-label="Место Бизнес: главная"
          >место<span>БИЗНЕС</span></a
        >
        <nav class="main-nav" aria-label="Основная навигация">
          <a href="/catalog?deal=sale">Продажа</a
          ><a href="/catalog?deal=rent">Аренда</a><a href="/catalog">Каталог</a>
        </nav>
        <div class="header-actions">
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Включить тёмную тему"
          >
            <svg
              class="theme-icon theme-icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"
              />
            </svg>
            <svg
              class="theme-icon theme-icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3.6" />
              <path
                d="M12 2.8v2.2M12 19v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.8 12H5M19 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"
              />
            </svg>
          </button>
          <a class="favorite-nav" href="/account?tab=favorites"
            >♡ &nbsp;Избранное</a
          ><a href="/login" data-auth-link>Войти</a
          ><a class="button" href="/publish">Разместить объект</a>
        </div>
      </div>
    </header>
    <main id="main">
      <div class="loading">Загружаем объекты для бизнеса…</div>
    </main>
    <footer>
      <div class="container footer-inner">
        <a class="logo" href="/">место<span>БИЗНЕС</span></a>
        <p data-content="footerTagline">
          Коммерческая недвижимость для деловых решений.
        </p>
        <a class="arrow-link" href="/catalog">Каталог объектов</a
        ><small>© 2026 Место Бизнес</small>
      </div>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="assistant"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
