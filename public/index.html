<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#235ee8" />
    <meta
      name="description"
      content="Место Бизнес: аренда и продажа коммерческой недвижимости. Офисы, торговые помещения, склады, производство и коммерческая земля."
    />
    <title>Место Бизнес | Коммерческая недвижимость</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="/assets/hero.webp"
      imagesrcset="
        /assets/hero-800.webp   800w,
        /assets/hero-1200.webp 1200w,
        /assets/hero-1600.webp 1600w
      "
      imagesizes="(max-width: 800px) 100vw, 50vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/assets/manrope.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">К содержимому</a>
    <header id="header">
      <div class="container header-inner">
        <a class="logo" href="/" aria-label="Место Бизнес: главная"
          >место<span>БИЗНЕС</span></a
        >
        <nav class="main-nav" aria-label="Основная навигация">
          <a href="/catalog?deal=sale">Продажа</a
          ><a href="/catalog?deal=rent">Аренда</a><a href="/catalog">Каталог</a>
        </nav>
        <div class="header-actions">
          <a class="favorite-nav" href="/account?tab=favorites"
            >♡ &nbsp;Избранное</a
          ><a href="/login" data-auth-link>Войти</a
          ><a class="button" href="/publish">Разместить объект</a>
        </div>
      </div>
    </header>
    <main id="main">
      <div class="loading">Загружаем объекты для бизнеса…</div>
    </main>
    <footer>
      <div class="container footer-inner">
        <a class="logo" href="/">место<span>БИЗНЕС</span></a>
        <p>Коммерческая недвижимость для деловых решений.</p>
        <a class="arrow-link" href="/catalog">Каталог объектов</a
        ><small>© 2026 Место Бизнес</small>
      </div>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="assistant"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
